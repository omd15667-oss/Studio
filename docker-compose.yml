version: '3.8'
services:
  api:
    build: ./backend
    container_name: batu_api
    volumes:
      - ./backend:/app
      - ./data:/app/data
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  frontend:
    build: ./frontend
    container_name: batu_frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
